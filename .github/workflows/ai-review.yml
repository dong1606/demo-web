name: Tự động AI Code Review (Gemini)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Lấy mã nguồn về máy ảo
        uses: actions/checkout@v4

      - name: Hỏi Google xem API Key hỗ trợ model nào
        run: curl -s https://generativelanguage.googleapis.com/v1beta/models?key=${{ secrets.GEMINI_API_KEY }} | grep '"name"'

      - name: Gọi Bot Gemini vào Review
        uses: sshnaidm/gemini-code-review-action@v2
        continue-on-error: true
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: gemini-1.5-flash
          prompt: |
            Bạn là một kỹ sư QC.
            Hãy review các đoạn code sau bằng Tiếng Việt.
            Tập trung tìm ra: Lỗ hổng bảo mật, lỗi logic, biến không sử dụng.
            Chỉ comment vào những dòng code thực sự có vấn đề.
